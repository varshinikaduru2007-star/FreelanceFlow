
services:
  - type: web
    name: freelanceflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FREELANCEFLOW_DB
        value: /tmp/freelancer.db
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
