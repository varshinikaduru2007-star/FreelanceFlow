
services:
  - type: web
    name: freelanceflow
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: freelanceflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FREELANCEFLOW_DB
        value: /var/data/freelancer.db
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
